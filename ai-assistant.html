<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI tư vấn mỹ phẩm | MakeupStore</title><link rel="stylesheet" href="styles.css"><style>
.ai-wrap{max-width:900px;margin:35px auto;padding:24px;background:#fff;border-radius:18px;box-shadow:0 8px 35px #7c35501a}.ai-wrap h1{color:#8e4164}.ai-form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.ai-form label{display:grid;gap:6px;font-weight:600}.ai-form input,.ai-form select,.ai-form textarea{padding:12px;border:1px solid #ddd;border-radius:9px;font:inherit}.ai-form textarea{grid-column:1/-1;min-height:110px}.ai-form button{background:#a64f78;color:white;border:0;border-radius:9px;padding:13px;font-weight:700;cursor:pointer}.ai-answer{white-space:pre-wrap;line-height:1.7;margin-top:20px}.rec{padding:14px;border:1px solid #f0dce6;border-radius:12px;margin:10px 0}.muted{color:#777}@media(max-width:600px){.ai-form{grid-template-columns:1fr}.ai-form textarea{grid-column:auto}}
</style></head><body><header class="header"><div class="logo"><span class="logo-icon">💄</span><span class="logo-text">MakeupStore · AI Beauty Advisor</span></div><a href="index.html">← Cửa hàng</a></header><main class="ai-wrap"><h1>✨ Trợ lý tư vấn mỹ phẩm AI</h1><p class="muted">Mô tả nhu cầu để AI gợi ý từ những sản phẩm hiện có và còn hàng trong cửa hàng.</p><form id="aiForm" class="ai-form"><label>Loại da<select id="skinType"><option value="">Chưa xác định</option><option>Da dầu</option><option>Da khô</option><option>Da hỗn hợp</option><option>Da thường</option><option>Da nhạy cảm</option></select></label><label>Ngân sách (VNĐ)<input id="budget" type="number" min="0" placeholder="Ví dụ: 500000"></label><label>Vấn đề quan tâm<input id="concerns" placeholder="Ví dụ: dưỡng ẩm, kiềm dầu"></label><label>Danh mục<select id="category"><option value="">Tất cả</option><option>Chăm sóc da</option><option>Trang điểm</option><option>Chống nắng</option><option>Làm sạch</option></select></label><textarea id="message" required maxlength="2000" placeholder="Ví dụ: Tôi có da dầu, muốn tìm kem chống nắng không gây bí da dưới 300.000đ..."></textarea><button type="submit">Nhận tư vấn từ AI</button></form><div id="status" class="muted" aria-live="polite"></div><section id="answer" class="ai-answer"></section><div id="recommendations"></div><p class="muted">Lưu ý: AI chỉ hỗ trợ tham khảo, không thay thế tư vấn y tế. Hãy kiểm tra thành phần và thử sản phẩm trên vùng da nhỏ trước khi sử dụng.</p></main><script src="ai-assistant.js"></script></body></html>
