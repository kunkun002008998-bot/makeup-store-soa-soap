<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập - MakeupStore</title><link rel="stylesheet" href="styles.css"><style>body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#fff0f5,#f7e8ef)}.login-card{width:min(430px,92vw);background:#fff;padding:34px;border-radius:20px;box-shadow:0 15px 45px #8e47701c}.login-card h1{margin:0 0 8px;color:#9b416c}.login-card p{color:#777}.login-card label{display:block;margin:18px 0 7px;font-weight:600}.login-card input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ddd;border-radius:9px}.login-card button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:9px;background:#b44f7a;color:white;font-weight:700;cursor:pointer}.msg{margin-top:14px;color:#b42318}.links{display:flex;justify-content:space-between;margin-top:18px;font-size:14px}</style></head><body><main class="login-card"><h1>💄 MakeupStore</h1><p>Đăng nhập để quản lý kho và lập hóa đơn.</p><form id="loginForm"><label for="email">Email</label><input id="email" type="email" required autocomplete="username" placeholder="admin@makeupstore.local"><label for="password">Mật khẩu</label><input id="password" type="password" required autocomplete="current-password" placeholder="Nhập mật khẩu"><button type="submit">Đăng nhập</button><div id="message" class="msg" role="alert"></div></form><div class="links"><a href="index.html">← Về cửa hàng</a><a href="admin.html">Trang quản trị</a></div></main><script>
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('message');m.textContent='Đang đăng nhập…';try{const r=await fetch('/api/auth/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'Đăng nhập thất bại');const next=new URLSearchParams(location.search).get('next');location.href=next==='admin.html'?'admin.html':(d.data.role==='admin'?'admin.html':'index.html');}catch(err){m.textContent=err.message;}});
</script></body></html>
